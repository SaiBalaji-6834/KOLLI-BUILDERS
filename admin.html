<!doctype html><html><head><base target="_top"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
:root{font-family:Arial,sans-serif;color:#17211e;background:#f5f4ef}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1180px;margin:auto;padding:24px}.top,.panel,.ticket{background:white;border:1px solid #deded5;border-radius:12px;padding:20px;margin-bottom:16px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center}.muted{color:#64716c;font-size:14px}h1{font-size:26px;margin:0 0 5px}h2{font-size:20px;margin-top:0}input,select,textarea,button{font:inherit;padding:12px;border:1px solid #cfd4cc;border-radius:6px;width:100%;background:#fff}textarea{min-height:100px;resize:vertical}button{cursor:pointer;background:#1d2b26;color:white;border:0;font-weight:600}.secondary{background:#f3f2ec;color:#17211e;border:1px solid #d6d7ce}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.layout{display:grid;grid-template-columns:360px 1fr;gap:16px}.ticket{padding:14px;cursor:pointer}.ticket.active{border-color:#a77c45;box-shadow:0 0 0 1px #a77c45}.pill{font-size:12px;background:#eeeae0;padding:5px 8px;border-radius:20px;display:inline-block}.stack{display:grid;gap:10px}.hidden{display:none!important}.message{padding:12px;border-radius:8px;background:#f5f4ef;margin:8px 0;white-space:pre-wrap;overflow-wrap:anywhere}.message.staff{background:#eaf2ec}.notice{padding:10px 0;color:#8b3b2f}.tools{display:flex;gap:8px}.tools button{width:auto}.ticket-title{font-weight:bold;margin:0 0 8px}.small{font-size:13px;color:#65716b}@media(max-width:760px){.layout,.row{grid-template-columns:1fr}.wrap{padding:12px}.top{align-items:flex-start;flex-direction:column}}
</style></head><body><main class="wrap"><header class="top"><div><h1>Kolli Builders — Staff Support</h1><div class="muted">Private ticket dashboard. Do not share this link or password.</div></div><button id="logout" class="secondary hidden" style="width:auto">Sign out</button></header>
<section id="login" class="panel"><h2>Staff sign in</h2><p class="muted">Enter the staff password configured by the administrator.</p><form id="login-form" class="stack"><input id="password" type="password" autocomplete="current-password" placeholder="Staff password" required><button>Sign in</button></form><p id="login-message" class="notice" role="status"></p></section>
<section id="dashboard" class="hidden"><div class="panel row"><input id="search" placeholder="Search ID, subject, name"><select id="status-filter"><option value="all">All statuses</option><option>Open</option><option>In Progress</option><option>Resolved</option><option>Closed</option></select></div><div class="layout"><div><div id="ticket-list" class="stack"></div></div><div id="detail" class="panel"><p class="muted">Select a ticket to view the question and reply.</p></div></div></section></main>
<script>
let token="",tickets=[],selected=null;const $=id=>document.getElementById(id);const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function run(fn,...args){return new Promise((resolve,reject)=>google.script.run.withSuccessHandler(resolve).withFailureHandler(e=>reject(new Error(e.message||String(e))))[fn](...args))}
$('login-form').addEventListener('submit',async e=>{e.preventDefault();$('login-message').textContent='Signing in…';try{const r=await run('adminLogin',$('password').value);token=r.token;$('password').value='';$('login').classList.add('hidden');$('dashboard').classList.remove('hidden');$('logout').classList.remove('hidden');await refresh()}catch(err){$('login-message').textContent=err.message}});
$('logout').addEventListener('click',async()=>{try{await run('adminLogout',token)}catch{}token='';selected=null;$('dashboard').classList.add('hidden');$('logout').classList.add('hidden');$('login').classList.remove('hidden');$('detail').innerHTML='<p class="muted">Sign in to manage tickets.</p>'});
$('search').addEventListener('input',renderList);$('status-filter').addEventListener('change',renderList);
async function refresh(){try{const r=await run('adminListTickets',token);tickets=r.tickets||[];renderList();if(selected){const t=tickets.find(x=>x.id===selected);if(t)await showTicket(t)}}catch(e){alert(e.message);if(/session/i.test(e.message))$('logout').click()}}
function renderList(){const q=$('search').value.toLowerCase(),f=$('status-filter').value;const list=tickets.filter(t=>(f==='all'||t.status===f)&&[t.id,t.name,t.subject,t.contact].join(' ').toLowerCase().includes(q));$('ticket-list').innerHTML=list.length?list.map(t=>`<article class="ticket ${selected===t.id?'active':''}" data-id="${esc(t.id)}"><p class="ticket-title">${esc(t.subject||'(No subject)')}</p><div class="small">${esc(t.id)} · ${esc(t.name)}</div><p><span class="pill">${esc(t.status)}</span> <span class="pill">${esc(t.priority)}</span></p></article>`).join(''):'<div class="panel muted">No tickets found.</div>';document.querySelectorAll('[data-id]').forEach(el=>el.addEventListener('click',()=>{const t=tickets.find(x=>x.id===el.dataset.id);if(t)showTicket(t)}))}
async function showTicket(t){selected=t.id;renderList();let m=[];try{m=(await run('adminListMessages',token,t.id)).messages||[]}catch(e){}$('detail').innerHTML=`<h2>${esc(t.subject)}</h2><p><span class="pill">${esc(t.id)}</span> <span class="pill">${esc(t.status)}</span></p><p><b>Customer:</b> ${esc(t.name)} · ${esc(t.contact)}</p><p><b>Category:</b> ${esc(t.category)} · <b>Priority:</b> ${esc(t.priority)}</p><p><b>Question</b><br>${esc(t.details)}</p><h3>Conversation</h3><div id="messages">${m.map(x=>`<div class="message ${x.sender==='Staff'?'staff':''}"><b>${esc(x.sender)}</b><div class="small">${esc(x.createdAt)}</div>${esc(x.message)}</div>`).join('')||'<p class="muted">No replies yet.</p>'}</div><form id="reply-form" class="stack"><label for="reply"><b>Reply to customer</b></label><textarea id="reply" required placeholder="Write the response the customer will see"></textarea><label for="resolution"><b>Resolution summary (optional)</b></label><textarea id="resolution" placeholder="Record the resolution">${esc(t.resolution)}</textarea><div class="row"><div><label for="new-status"><b>Status</b></label><select id="new-status">${['Open','In Progress','Resolved','Closed'].map(s=>`<option ${t.status===s?'selected':''}>${s}</option>`).join('')}</select></div><div style="display:flex;align-items:end"><button type="submit">Send reply & save</button></div></div></form><div class="tools" style="margin-top:12px"><button class="secondary" id="refresh-ticket">Refresh</button><button class="secondary" id="reopen-ticket">Reopen ticket</button></div><p id="detail-message" class="muted" role="status"></p>`;
$('reply-form').addEventListener('submit',async e=>{e.preventDefault();const msg=$('reply').value.trim();if(!msg)return;const btn=e.submitter;btn.disabled=true;try{await run('adminReplyTicket',token,t.id,msg,$('new-status').value,$('resolution').value.trim());$('detail-message').textContent='Reply saved. The customer can now see it using their ticket ID and contact detail.';await refresh()}catch(err){$('detail-message').textContent=err.message}finally{btn.disabled=false}});
$('refresh-ticket').addEventListener('click',refresh);$('reopen-ticket').addEventListener('click',async()=>{try{await run('adminSetStatus',token,t.id,'Open',t.resolution||'');await refresh();$('detail-message').textContent='Ticket reopened.'}catch(e){$('detail-message').textContent=e.message}})}
</script></body></html>
